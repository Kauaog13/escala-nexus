name: CI — Escala Nexus

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Testes (Unit/Golden/Property) e Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar pureza arquitetural (ESLint — DEC-F)
        run: npm run lint

      - name: Verificar tipagem estrita (TypeScript)
        run: npm run typecheck

      - name: Executar suítes de testes (Schema SQL, Repositório ACID, Motor, Golden, Propriedade e Workflow)
        run: npm test

      - name: Gerar build de produção (Vite)
        run: npm run build

